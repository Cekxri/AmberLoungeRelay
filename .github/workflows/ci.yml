name: CI ~ syntax and sanity :3

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Node checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check proxy.mjs

      - name: config.json parses
        run: node -e "JSON.parse(require('fs').readFileSync('config.json','utf8')); console.log('config.json tastes fine :3')"

      - name: The relay comes up and /health answers
        run: |
          HOST=127.0.0.1 PORT=3050 node proxy.mjs &
          sleep 2
          curl -fsS http://127.0.0.1:3050/health
          echo " ~ the bar is open UwU"

  docker:
    name: Docker build & health :3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t cidercc-uwu:ci .

      - name: Run it and knock on the door
        run: |
          docker run -d --name cidercc-ci -p 3050:3050 cidercc-uwu:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3050/health >/dev/null 2>&1; then
              echo "health: $(curl -fsS http://127.0.0.1:3050/health) ~ the container bar is open UwU"
              exit 0
            fi
            sleep 1
          done
          echo "container never answered /health"; docker logs cidercc-ci; exit 1

      - name: Tidy up
        if: always()
        run: docker rm -f cidercc-ci || true
